# MCP servers the agent uses besides Home Assistant's own, which it always connects.
#
# Read per session, and bind-mounted like prompt.yaml, so an edit applies to the next
# conversation. Point MCP_CONFIG (or AGENT_MCP_CONFIG in docker-compose) at a copy to use
# your own list; without a file the agent has only Home Assistant's tools.
#
# Values take ${VAR} or ${VAR:-default} from the environment, so keys stay in .env. Per
# entry:
#   id               the toolset's name, and what a person's Settings entry lists for a
#                    restricted server
#   title            how the Settings tab names a restricted server (default: the id)
#   url              Streamable HTTP endpoint; an entry whose url comes out empty is skipped
#   headers          sent on every request; a header whose variable is unset is left out
#   requires         variables that must be set, or the entry is skipped
#   timeout          seconds for any one request to the server (default 5)
#   allowed_tools    only these of the server's tools reach the LLM
#   report_progress  tools that answer at once and report their result as a later update;
#                    they run in the background, and only a force stop cancels them
#   per_person       an adapter scoping the server to the person speaking (mem0)
#   restricted       offered only to people whose Settings entry lists this id
#   confirm          tools that run only once the person has spoken since the model first
#                    called them, which answers by asking the model to get their yes
#   callback         sends this agent's webhook as X-Callback-Url / X-Callback-Token, for
#                    results that outlive a tool call (needs CALLBACK_BASE_URL and
#                    TEXT_API_TOKEN)

servers:
  # Parallel Search: web_search and web_fetch. The anonymous free tier needs no key.
  - id: web-search
    url: ${WEB_SEARCH_URL:-https://search.parallel.ai/mcp}
    headers:
      Authorization: Bearer ${PARALLEL_API_KEY}

  # Mem0: preferences remembered across conversations, each person's in their own scope.
  - id: memory
    url: https://mcp.mem0.ai/mcp
    headers:
      Authorization: Bearer ${MEM0_API_KEY}
    requires: [MEM0_API_KEY]
    # Mem0 routinely takes 3-4 s to list its tools, and a failed setup loses memory
    timeout: 20
    # bulk deletes and event bookkeeping stay out of the LLM's reach
    allowed_tools: [add_memory, search_memories, get_memories, update_memory, delete_memory]
    per_person: mem0

  # music-mcp-server: Apple Music on a Mac and its AirPlay speakers, with presets from
  # a Shortcuts folder.
  - id: music
    title: Music
    url: ${MUSIC_MCP_URL}
    requires: [MUSIC_MCP_URL]
    # starting a catalog album takes about 15 s
    timeout: 45
    report_progress: [play_music]

  # baby-mcp-server: log a baby's diapers, feeds and sleep in the Baby Tracker app on a Mac,
  # through a Shortcuts folder.
  - id: baby
    title: Baby log
    url: ${BABY_MCP_URL}
    requires: [BABY_MCP_URL]
    # each entry runs a shortcut, about 8 s
    timeout: 45

  # herdr-mcp-server: start, check and prompt coding agents (Claude Code) on a computer
  # running herdr (https://github.com/longcw/herdr-mcp-server). They can run code there,
  # so only people whose Settings entry lists "herdr" get it.
  - id: herdr
    title: Coding agents (herdr)
    url: ${HERDR_MCP_URL}
    requires: [HERDR_MCP_URL]
    # a tool that sends work waits up to the server's 60 s watch window
    timeout: 90
    report_progress:
      - start_herdr_agent
      - watch_herdr_agent
      - prompt_herdr_agent
      - answer_herdr_permission
      - resume_herdr_agent
    restricted: true
    # the model tends to ask and act in one turn; these wait for the person's answer
    confirm: [start_herdr_agent, answer_herdr_permission]
    callback: true

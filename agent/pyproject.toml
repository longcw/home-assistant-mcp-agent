[project]
name = "home-assistant-mcp-agent"
version = "0.1.0"
description = "LiveKit voice agent that controls Home Assistant via its native MCP server"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[mcp]>=1.6",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pandas-stubs>=2.0",
]

[tool.uv]
package = false

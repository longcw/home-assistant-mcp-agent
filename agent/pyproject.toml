[project]
name = "home-assistant-mcp-agent"
version = "0.1.0"
description = "LiveKit voice agent that controls Home Assistant via its native MCP server"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[mcp,a2a,openai]>=1.6",
    "livekit-protocol>=1.1.27",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pandas-stubs>=2.0",
]

[tool.uv]
package = false

# Text chat runs on the draft session-persistence API (livekit/agents#7465), which needs
# livekit-protocol's agent-db module from python-sdks main (livekit/python-sdks#831).
# Both are pinned to commits; docs/text-endpoint.md says how to move them.
[tool.uv.sources]
livekit-agents = { git = "https://github.com/livekit/agents.git", rev = "5359777b6a01cdd6caa7b1108cd20d48f51edff3", subdirectory = "livekit-agents" }
livekit-protocol = { git = "https://github.com/livekit/python-sdks.git", rev = "082e83c44dea983cca8aec21c948f84aa040d97c", subdirectory = "livekit-protocol" }

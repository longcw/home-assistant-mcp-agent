services:
  agent:
    build:
      context: ./agent
    container_name: home-assistant-mcp-agent
    restart: always
    # HA_URL, HA_TOKEN, LIVEKIT_* and LIVEKIT_INFERENCE_* — see .env.example
    env_file: .env
    environment:
      # The scheduler is reachable by service name on the shared network, and the
      # worker's scheduling tools call it.
      SCHEDULER_URL: http://ha-notify-scheduler:8080
    volumes:
      # System prompt and MCP server list are mounted (not baked in) so edits apply on the
      # next conversation with no image rebuild, since both are re-read per session. Set
      # AGENT_PROMPT / AGENT_MCP_CONFIG in .env to use your own untracked copies, e.g.
      # agent/prompt.local.yaml with rules for your home.
      - ${AGENT_PROMPT:-./agent/prompt.yaml}:/app/prompt.yaml:ro
      - ${AGENT_MCP_CONFIG:-./agent/mcp.yaml}:/app/mcp.yaml:ro
      # Persisted text conversations (one SQLite file each) and the current one's id.
      - ./agent-data:/data
    ports:
      # The agent server's HTTP app: the text chat bridge at /chat and its A2A endpoint at
      # /home-assistant, both behind TEXT_API_TOKEN (off when that is unset).
      - "8952:8081"
    # A graceful stop closes the loaded text conversations, which is when they save.
    stop_grace_period: 30s
    networks:
      - home-assistant-network
    depends_on:
      - ha-notify-scheduler

  ha-notify-scheduler:
    build:
      context: ./ha-notify-scheduler
    container_name: ha-notify-scheduler
    restart: always
    # Needs HA_URL/HA_TOKEN (to send reminders), TEXT_API_TOKEN (to hand an instruction to
    # the agent's /chat at http://agent:8081), AGENT_TZ, and (once exposed) SCHEDULER_TOKEN.
    env_file: .env
    environment:
      SCHEDULER_DB: /data/scheduler.db
    ports:
      # Published (on an uncommon host port) so the Home Assistant integration (on another
      # host) can reach the tasks API for the management tab. Container still listens on 8080,
      # which is what the worker uses over the compose network. Protected by SCHEDULER_TOKEN.
      - "8951:8080"
    volumes:
      # Bind-mounted so the SQLite DB is visible on the host at ha-notify-scheduler/data/
      # (gitignored). Persists across restarts.
      - ./ha-notify-scheduler/data:/data
    networks:
      - home-assistant-network

networks:
  home-assistant-network:
    driver: bridge
